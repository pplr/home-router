# GRUB A/B slot selection for RAUC on Futro S920
#
# Partition layout (fixed UUIDs):
#   gpt1 = EFI boot   PARTUUID=f7200001-a001-4000-8001-000000000001
#   gpt2 = grubenv     PARTUUID=f7200002-a001-4000-8001-000000000002  FSUUID=F720-0002
#   gpt3 = rootfs-a    PARTUUID=f7200003-a001-4000-8001-000000000003
#   gpt4 = rootfs-b    PARTUUID=f7200004-a001-4000-8001-000000000004
#   gpt5 = data         PARTUUID=f7200005-a001-4000-8001-000000000005

set default="0"
set timeout=3

# High-res framebuffer console
set gfxmode=auto
terminal_output gfxterm
set gfxpayload=keep

# Locate grubenv partition by filesystem UUID (stable across disk reordering)
search --no-floppy --fs-uuid --set=grubenv_part F720-0002

# Load RAUC slot state from grubenv partition
load_env --file=($grubenv_part)/grubenv

# Default: boot order A then B
if [ -z "$ORDER" ]; then
    set ORDER="A B"
fi

if [ -z "$A_TRY" ]; then set A_TRY=0; fi
if [ -z "$B_TRY" ]; then set B_TRY=0; fi
if [ -z "$A_OK" ]; then set A_OK=0; fi
if [ -z "$B_OK" ]; then set B_OK=0; fi

set KERNEL_PARAMS="rootfstype=ext4 console=ttyS0,115200 console=tty0"

# Determine which slot to boot based on ORDER, _TRY counts, and _OK flags.
# RAUC sets ORDER and _TRY/_OK via grub-editenv.
set bootslot=""
for s in $ORDER; do
    if [ "$s" = "A" ]; then
        if [ "$A_TRY" -gt 0 ]; then
            set bootslot="A"
            set A_TRY=$((A_TRY - 1))
            save_env --file=($grubenv_part)/grubenv A_TRY
            break
        elif [ "$A_OK" -eq 1 ]; then
            set bootslot="A"
            break
        fi
    elif [ "$s" = "B" ]; then
        if [ "$B_TRY" -gt 0 ]; then
            set bootslot="B"
            set B_TRY=$((B_TRY - 1))
            save_env --file=($grubenv_part)/grubenv B_TRY
            break
        elif [ "$B_OK" -eq 1 ]; then
            set bootslot="B"
            break
        fi
    fi
done

if [ "$bootslot" = "A" ]; then
    set default="1"
elif [ "$bootslot" = "B" ]; then
    set default="2"
else
    set default="0"
fi

menuentry "Rescue Shell" {
    echo "No bootable slot found. Dropping to GRUB shell."
    echo "Try: set root=(hd0,gpt3); linux /boot/bzImage root=PARTUUID=f7200003-a001-4000-8001-000000000003"
}

menuentry "Slot A" --id slota {
    set root=(hd0,gpt3)
    linux /boot/bzImage root=PARTUUID=f7200003-a001-4000-8001-000000000003 rauc.slot=A $KERNEL_PARAMS
}

menuentry "Slot B" --id slotb {
    set root=(hd0,gpt4)
    linux /boot/bzImage root=PARTUUID=f7200004-a001-4000-8001-000000000004 rauc.slot=B $KERNEL_PARAMS
}
