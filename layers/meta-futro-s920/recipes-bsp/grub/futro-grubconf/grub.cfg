# GRUB A/B slot selection for RAUC on Futro S920
#
# Partition layout:
#   (hd0,gpt1) = EFI boot partition
#   (hd0,gpt2) = grubenv partition (1 MiB vfat)
#   (hd0,gpt3) = rootfs slot A
#   (hd0,gpt4) = rootfs slot B

set default="0"
set timeout=3

# Load RAUC slot state from grubenv partition
load_env --file=(hd0,gpt2)/grubenv

# Default: boot order A then B
if [ -z "$ORDER" ]; then
    set ORDER="A B"
fi

if [ -z "$A_TRY" ]; then set A_TRY=0; fi
if [ -z "$B_TRY" ]; then set B_TRY=0; fi
if [ -z "$A_OK" ]; then set A_OK=0; fi
if [ -z "$B_OK" ]; then set B_OK=0; fi

set KERNEL_PARAMS="rootfstype=ext4 console=ttyS0,115200 console=tty0"

# Determine which slot to boot based on ORDER, _TRY counts, and _OK flags.
# RAUC sets ORDER and _TRY/_OK via grub-editenv.
set bootslot=""
for s in $ORDER; do
    if [ "$s" = "A" ]; then
        if [ "$A_TRY" -gt 0 ]; then
            set bootslot="A"
            set A_TRY=$((A_TRY - 1))
            save_env --file=(hd0,gpt2)/grubenv A_TRY
            break
        elif [ "$A_OK" -eq 1 ]; then
            set bootslot="A"
            break
        fi
    elif [ "$s" = "B" ]; then
        if [ "$B_TRY" -gt 0 ]; then
            set bootslot="B"
            set B_TRY=$((B_TRY - 1))
            save_env --file=(hd0,gpt2)/grubenv B_TRY
            break
        elif [ "$B_OK" -eq 1 ]; then
            set bootslot="B"
            break
        fi
    fi
done

if [ "$bootslot" = "A" ]; then
    set default="1"
elif [ "$bootslot" = "B" ]; then
    set default="2"
else
    set default="0"
fi

menuentry "Rescue Shell" {
    echo "No bootable slot found. Dropping to GRUB shell."
    echo "Try: set root=(hd0,gpt3); linux /boot/bzImage root=PARTLABEL=rootfs-a"
}

menuentry "Slot A" --id slota {
    search --no-floppy --label rootfs-a --set=root
    linux /boot/bzImage root=PARTLABEL=rootfs-a rauc.slot=A $KERNEL_PARAMS
}

menuentry "Slot B" --id slotb {
    search --no-floppy --label rootfs-b --set=root
    linux /boot/bzImage root=PARTLABEL=rootfs-b rauc.slot=B $KERNEL_PARAMS
}
