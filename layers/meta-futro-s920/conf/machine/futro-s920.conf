#@TYPE: Machine
#@NAME: Fujitsu Futro S920
#@DESCRIPTION: Machine configuration for the Fujitsu Futro S920 thin client
#  AMD GX-222GC (Jaguar, x86-64, SSE4.2, no AVX2), 4GB RAM, 8GB mSATA SSD, 3 NICs.

DEFAULTTUNE ?= "corei7-64"
require conf/machine/include/x86/tune-corei7.inc
include conf/machine/include/x86/x86-base.inc

# Headless router: EFI boot, PCI/USB for NIC drivers, serial for console, ACPI
MACHINE_FEATURES = "efi pci usb serial acpi"

PREFERRED_VERSION_linux-yocto ?= "6.12%"
PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"

MACHINE_EXTRA_RRECOMMENDS += "kernel-modules linux-firmware"

IMAGE_FSTYPES += "wic.zst wic.bmap"
WKS_FILE ?= "futro-s920-rauc.wks"
EFI_PROVIDER ?= "grub-efi"
PREFERRED_RPROVIDER_virtual-grub-bootconf ?= "futro-grubconf"
do_image_wic[depends] += "gptfdisk-native:do_populate_sysroot"
do_image_wic[depends] += "boot-image:do_deploy"
do_image_wic[recrdeptask] += "do_bootimg"
