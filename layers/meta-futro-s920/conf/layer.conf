# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-futro-s920"
BBFILE_PATTERN_meta-futro-s920 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-futro-s920 = "6"

LAYERDEPENDS_meta-futro-s920 = "core"
LAYERSERIES_COMPAT_meta-futro-s920 = "whinlatter"
