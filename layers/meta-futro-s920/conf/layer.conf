# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-futro-s920"
BBFILE_PATTERN_meta-futro-s920 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-futro-s920 = "6"

LAYERDEPENDS_meta-futro-s920 = "core rauc openembedded-layer networking-layer webserver"
LAYERSERIES_COMPAT_meta-futro-s920 = "wrynose"

# RAUC signing keys (used by bundle recipes)
LAYERDIR_meta-futro-s920 := "${LAYERDIR}"
RAUC_KEY_FILE ?= "${LAYERDIR_meta-futro-s920}/files/rauc-keys/development-1.key.pem"
RAUC_CERT_FILE ?= "${LAYERDIR_meta-futro-s920}/files/rauc-keys/development-1.cert.pem"

# Out-of-tree secrets (gitignored): password hash, machine-id, ssh host keys,
# OVH API credentials, AP push key.
# See files/secrets/README.md for generation instructions.
SECRETS_DIR ?= "${LAYERDIR_meta-futro-s920}/files/secrets"

# The AP-side secrets tree (aps/secrets, also gitignored). futro-ap-certs
# reads two *non-secret* things from it: each AP's CSR (whose private key
# stays baked on the AP) and the fleet's dropbear host public keys, which
# it pins into a known_hosts file for the certificate push.
AP_SECRETS_DIR ?= "${LAYERDIR_meta-futro-s920}/../../aps/secrets"

# Repo-root checkout where the routerbuild/ Python package and config.toml
# live. Recipes that consume the declarative network config (network +
# base-files bbappends, futro-ap-certs) import routerbuild from this path
# and read config.toml. The layer dir sits at <repo>/layers/meta-futro-s920,
# so two parent steps land at the repo root.
ROUTERBUILD_ROOT ?= "${LAYERDIR_meta-futro-s920}/../.."
CONFIG_TOML ?= "${ROUTERBUILD_ROOT}/config.toml"
