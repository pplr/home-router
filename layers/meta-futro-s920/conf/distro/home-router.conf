require conf/distro/poky.conf

DISTRO = "home-router"
DISTRO_NAME = "Home Router"
DISTRO_CODENAME = "wrynose"
DISTRO_VERSION = "1.0"

INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " rauc"

# Trim oe-core's DISTRO_FEATURES_DEFAULTS (default-distrovars.inc) down to what a
# headless, wired x86 router needs. Opting out is the supported knob here:
# bitbake.conf welds DISTRO_FEATURES_DEFAULTS minus DISTRO_FEATURES_OPTED_OUT onto
# DISTRO_FEATURES via filter_default_features(). (Replaces the old
# DISTRO_FEATURES_BACKFILL_CONSIDERED.) Kept: ipv4 ipv6 vfat (ESP) ext2 seccomp
# acl xattr pci ldconfig.
DISTRO_FEATURES_OPTED_OUT += " \
    alsa pulseaudio \
    x11 wayland opengl vulkan \
    bluetooth wifi nfc 3g \
    nfs zeroconf \
    gobject-introspection-data \
    multiarch ptest debuginfod \
"

# Only one locale is installed (IMAGE_LINGUAS = "c" in the image bbappend), but
# glibc otherwise generates every entry in its SUPPORTED file — ~1900 locales,
# 501 locale-base-* packages — for the image to throw away. The variable is read
# only in libc-package.bbclass; unset or "all" means all.
GLIBC_GENERATE_LOCALES = "C.UTF-8"
