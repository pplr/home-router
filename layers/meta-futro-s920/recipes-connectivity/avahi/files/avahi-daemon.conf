# avahi-daemon as an mDNS reflector between the LAN and IoT bridges.
#
# mDNS (224.0.0.251 / ff02::fb, UDP 5353) is link-local multicast and never
# crosses the router's L3 boundary on its own. The reflector terminates it on
# each configured bridge and re-emits it on the others, so an IoT device that
# advertises itself (a printer, a Chromecast, …) becomes discoverable from the
# trusted LAN. See CLAUDE.md "Networking" / IoT VLAN.

[server]
use-ipv4=yes
use-ipv6=yes
# Reflect ONLY between the LAN and IoT bridges. wan0 (Freebox/internet side)
# and br-iptv (L2-only IPTV ferry) are excluded so mDNS never leaks there.
allow-interfaces=br-lan,br-iot

[publish]
# The router itself is not an mDNS service host — it only relays. Don't
# advertise the router's own hostname/HINFO into either domain.
publish-hinfo=no
publish-workstation=no

[reflector]
enable-reflector=yes
