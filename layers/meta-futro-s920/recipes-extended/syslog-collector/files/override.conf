# Drop-in for rsyslog.service shipped by the syslog-collector recipe.
#
# Two purposes:
#  1. Make sure rsyslog binds 10.0.0.1 *after* systemd-networkd has
#     actually configured br-lan — otherwise the imudp listener fails
#     to bind with EADDRNOTAVAIL on cold boot.
#  2. Apply sensible hardening defaults for a daemon that listens on
#     UDP/514 from the LAN.

[Unit]
# network-online.target waits for at least one routable interface; on
# this router it fires once systemd-networkd-wait-online has seen
# br-lan come up with its 10.0.0.1/24. Pulling it in explicitly is
# redundant with the upstream unit, but cheap and self-documenting.
Wants=network-online.target systemd-networkd-wait-online.service
After=network-online.target systemd-networkd-wait-online.service

[Service]
# Lock down what rsyslog can see and touch. Keep /var/log writable for
# any on-disk logging, and keep the journal socket reachable for omjournal.
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
NoNewPrivileges=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
# /var/spool/rsyslog and /run/log don't exist in this image (we forward
# straight to the journal via omjournal — no on-disk spool/queue). With
# ProtectSystem=strict, listing a nonexistent path in ReadWritePaths aborts
# namespace setup with status=226/NAMESPACE and the daemon never starts.
# The "-" prefix makes systemd silently skip a missing path; /var/log is
# left unprefixed because it always exists and rsyslog genuinely needs it.
ReadWritePaths=/var/log -/var/spool/rsyslog -/run/log

# CAP_NET_BIND_SERVICE is required for binding UDP/514 (privileged port).
# CAP_SYSLOG covers /dev/kmsg reads via imklog. Drop everything else.
#
# CAP_SETPCAP must stay in the bounding set: rsyslog is built with
# libcap-ng (meta-oe default) and drops its *own* capabilities right
# after config load via capng_apply(CAPNG_SELECT_BOTH), which prunes
# the bounding set — and PR_CAPBSET_DROP requires CAP_SETPCAP. Without
# it capng_apply fails and rsyslogd aborts with exit 1 *before its
# logging is up* (libcapng.default=on makes the failure fatal), so the
# unit flaps with no error message in the journal. rsyslog does not
# preserve CAP_SETPCAP in its keep-list, so it is gone again the moment
# the self-drop succeeds — net effective caps end up NET_BIND_SERVICE +
# SYSLOG either way.
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_SYSLOG CAP_SETPCAP
AmbientCapabilities=CAP_NET_BIND_SERVICE CAP_SYSLOG
