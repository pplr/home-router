# Remote syslog collector for the home-network APs.
#
# The two OpenWrt APs (ap-ax3600, ap-r3g) ship UDP/514 syslog messages
# to the router via their `option log_ip '10.0.0.1'` setting. Forward
# them straight into the systemd journal so there's one log surface
# (journalctl) and they inherit the existing persistence + retention
# policy on /data/var/log/journal.
#
# Per-AP filtering: `journalctl REMOTE_HOST=ap-ax3600`. NOTE it is *not*
# `_HOSTNAME` — that is a journald-stamped trusted field and always reads
# `home-router` for anything written through the local journald socket.
# journald rejects any client-supplied field starting with `_`
# (journal_field_valid(..., allow_protected=false) in journald-native.c),
# so omjournal cannot set `_HOSTNAME`; the AP's self-reported hostname is
# carried in the custom `REMOTE_HOST` field instead. (Consequence:
# `journalctl -o short` still shows `home-router` in the host column for
# AP entries — REMOTE_HOST is for filtering and -o verbose, not the
# host column.)

# Listen only on the LAN address — never on 0.0.0.0. The WAN side must
# never see this listener even before nftables is loaded.
module(load="imudp")
input(type="imudp" port="514" address="10.0.0.1")

# Push remote messages to the journal via omjournal.
module(load="omjournal")

# Journal fields for forwarded AP messages. omjournal consumes a template
# as a JSON object (OMSR_TPL_AS_JSON -> tplToJSON): each property's
# `outname` becomes the journal field, the value is stored as a string.
# Supplying a template *replaces* omjournal's built-in field set, so we
# reproduce its defaults (MESSAGE/PRIORITY/SYSLOG_FACILITY/
# SYSLOG_IDENTIFIER) and add REMOTE_HOST. Field names must be uppercase
# [A-Z0-9_] or journald drops them. PRIORITY uses the `pri` property to
# match omjournal's own default of facility*8|severity.
template(name="omjournal_ap" type="list") {
    property(outname="MESSAGE"           name="msg")
    property(outname="PRIORITY"          name="pri")
    property(outname="SYSLOG_FACILITY"   name="syslogfacility")
    property(outname="SYSLOG_IDENTIFIER" name="programname")
    property(outname="REMOTE_HOST"       name="hostname")
}

# Only accept messages from the trusted LAN subnet. The bind address
# already prevents WAN ingress; this is defense in depth in case a
# misconfigured bridge or future change exposes the listener wider.
if $fromhost-ip startswith "10.0.0." then {
    action(type="omjournal" template="omjournal_ap")
    stop
}
