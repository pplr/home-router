# chrony.conf — NTP server for the home network.
#
# Replaces the chrony.conf shipped by the upstream chrony recipe. The
# router serves as the LAN's authoritative time source so the APs
# (ap-ax3600, ap-r3g) and any other LAN client can get time without
# reaching the public pool — they point at 10.0.0.1 via UCI/networkd.

# Upstream pools: French servers plus Cloudflare's global anycast as a
# fallback. `iburst` cuts initial sync from minutes to seconds;
# `maxsources 4` keeps the working set bounded.
pool 2.fr.pool.ntp.org iburst maxsources 4
server time.cloudflare.com iburst

# Listen only on LAN-facing addresses. Defense in depth — even if the
# firewall's br-lan accept-all is loosened in the future, chrony itself
# will refuse to answer on wan0 or br-iot.
bindaddress 127.0.0.1
bindaddress ::1
bindaddress 10.0.0.1
bindaddress 2a01:e0a:97f:5432::1

# Serve time only to the trusted LAN (v4 + delegated v6 /64). IoT and
# anyone else is denied; chrony's default policy without an `allow` is
# already deny, so this is documentation as much as enforcement.
allow 10.0.0.0/24
allow 2a01:e0a:97f:5432::/64
deny all

# Drift file: chrony records the local clock's measured drift so it can
# keep good time between NTP exchanges and across reboots.
# /var/lib/chrony is created by the chrony package's install scripts.
driftfile /var/lib/chrony/drift

# Step the clock if it's off by >1s during the first 3 updates; smooth
# slew thereafter. Step-then-slew avoids surprising timer-sensitive
# services (rsyslog, journal entries, cert validity windows) with a
# sudden large jump after the daemon has been running for a while.
makestep 1.0 3

# Sync the hardware (RTC) clock so cold boots come up with a sane time
# before chrony has talked to any peer.
rtcsync

# Logging goes to syslog → journal (no separate logdir).
