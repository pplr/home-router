# Minimal, journal-only rsyslog config for home-router.
#
# This device logs through systemd-journald (persistent on
# /data/var/log/journal). rsyslog exists ONLY to collect remote OpenWrt AP
# syslog (udp/514) and forward it into the journal via omjournal — see
# syslog-collector's 10-remote.conf, pulled in by the include below.
#
# We deliberately drop OE-core's stock local input modules (imuxsock/imklog/
# immark) and all traditional /var/log/* file actions: journald already owns
# /dev/log and kernel logs, and /var/log is tmpfs (wiped each boot) so the
# files were redundant. Their omfile chown to group `adm` also failed under
# the hardened cap set (no CAP_CHOWN), spamming err-priority lines per boot.

# CVE-2015-3243: keep created files non-world-readable (defensive default).
$FileCreateMode 0640
$Umask 0022

# Remote-AP collector config (imudp + omjournal) lives here.
$IncludeConfig /etc/rsyslog.d/*.conf
