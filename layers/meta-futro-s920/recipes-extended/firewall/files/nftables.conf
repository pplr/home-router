#!/usr/sbin/nft -f
#
# Stateful firewall (IPv4 + IPv6) for the home-router.
#
# Treats the WAN side as hostile; trusts the LAN bridge. systemd-networkd
# installs its own `ip nat` table for IPv4 masquerade (IPMasquerade=ipv4 on
# wan0); that table lives in a different family and is intentionally not
# touched here, so `nft -f /etc/nftables.conf` can be re-run at runtime to
# reload this ruleset without flushing networkd's NAT rules.

# Atomic table replacement: ensure the table exists so the delete succeeds
# even on the very first load.
table inet filter
delete table inet filter

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop

        iif "lo" accept

        # ICMP and ICMPv6 — ICMPv6 is required for Neighbor Discovery,
        # Router Advertisement reception on WAN, and PMTUD.
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # Trust everything from the LAN (SSH, DNS, DHCPv4 server, etc.).
        iifname "br-lan" accept

        # Untrusted IoT VLAN: narrow allow — only DHCPv4 (networkd's DHCP
        # server receive path is a regular UDP socket, so it does traverse
        # netfilter; replies go via AF_PACKET and bypass netfilter on egress)
        # and DNS to resolved's stub on 10.0.30.1 / 2a01:e0a:97f:5433::1.
        # Everything else falls through to the drop policy — SSH, netdata,
        # etc. on the router are unreachable from IoT.
        iifname "br-iot" udp dport 67 accept
        iifname "br-iot" udp dport 53 accept
        iifname "br-iot" tcp dport 53 accept

        # mDNS (UDP 5353): let avahi's reflector receive announcements/queries
        # from IoT devices (printers, etc.) so it can relay them to the LAN,
        # making them discoverable there. Family-agnostic — covers IPv4
        # (224.0.0.251) and IPv6 (ff02::fb). br-lan is already fully accepted
        # above. Reflected packets are re-originated by the router itself
        # (output = accept); the follow-up LAN→IoT unicast is already permitted
        # by the forward chain, so no forward rule is needed.
        iifname "br-iot" udp dport 5353 accept

        # DHCPv4 client replies on WAN (server src udp/67 → client dst udp/68).
        iifname "wan0" udp sport 67 udp dport 68 accept

        # Everything else (i.e. unsolicited inbound on wan0) hits the drop policy.
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop

        # LAN → WAN egress; return traffic handled by conntrack above. For
        # IPv4 this matches before SNAT (forward priority 0, nat postrouting
        # priority 100), so we still see the original 10.0.0.0/24 source.
        # For IPv6 there is no NAT — LAN clients carry public GUAs from the
        # delegated /64.
        iifname "br-lan" oifname "wan0" accept

        # Asymmetric LAN ↔ IoT trust: LAN can initiate to IoT (so a laptop
        # can reach a smart hub); IoT-initiated traffic toward br-lan is
        # implicitly dropped by the default policy. Return traffic for
        # LAN-initiated sessions flows back via ct state established,related
        # above. Family-agnostic (table inet), so this covers IPv4 and IPv6.
        iifname "br-lan" oifname "br-iot" accept

        # IoT → WAN egress (NAT44 via IPMasquerade=ipv4 on br-iot; native v6).
        iifname "br-iot" oifname "wan0" accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
