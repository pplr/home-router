#!/usr/sbin/nft -f
#
# Stateful firewall (IPv4 + IPv6) for the home-router.
#
# Treats the WAN side as hostile; trusts the LAN bridge. systemd-networkd
# installs its own `ip nat` table for IPv4 masquerade (IPMasquerade=ipv4 on
# wan0); that table lives in a different family and is intentionally not
# touched here, so `nft -f /etc/nftables.conf` can be re-run at runtime to
# reload this ruleset without flushing networkd's NAT rules.

# Atomic table replacement: ensure the table exists so the delete succeeds
# even on the very first load.
table inet filter
delete table inet filter

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop

        iif "lo" accept

        # ICMP and ICMPv6 — ICMPv6 is required for Neighbor Discovery,
        # Router Advertisement reception on WAN, and PMTUD.
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # Trust everything from the LAN (SSH, DNS, DHCPv4 server, etc.).
        iifname "br-lan" accept

        # DHCPv4 client replies on WAN (server src udp/67 → client dst udp/68).
        iifname "wan0" udp sport 67 udp dport 68 accept

        # Everything else (i.e. unsolicited inbound on wan0) hits the drop policy.
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop

        # LAN → WAN egress; return traffic handled by conntrack above. For
        # IPv4 this matches before SNAT (forward priority 0, nat postrouting
        # priority 100), so we still see the original 10.0.0.0/24 source.
        # For IPv6 there is no NAT — LAN clients carry public GUAs from the
        # delegated /64.
        iifname "br-lan" oifname "wan0" accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
