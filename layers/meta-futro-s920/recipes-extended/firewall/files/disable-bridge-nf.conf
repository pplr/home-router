# Keep L2-switched traffic OUT of the firewall.
#
# When br_netfilter is active, `bridge-nf-call-iptables` defaults to 1, which
# pushes IPv4/IPv6 frames that are *switched within a single bridge* through the
# nftables `inet ... forward` chain. Our forward chain is policy-drop and only
# permits *routed* paths (br-lan->wan0, br-lan->br-iot, br-iot->wan0), so
# same-bridge traffic between two LAN clients — e.g. a wired laptop on lan0 and
# an AP on lan1, both members of br-lan — gets silently dropped. ARP still works
# (it isn't IP, so it bypasses netfilter), which is the tell: `arping <peer>`
# succeeds but `ping <peer>` times out for two hosts on the same LAN bridge.
#
# Setting the three knobs to 0 makes intra-bridge traffic plain L2 switching
# that never reaches the firewall. Routed traffic (LAN<->WAN, LAN<->IoT, NAT) is
# unaffected: it traverses ip_forward()/ip6_forward() and still hits the
# `forward` chain regardless of br_netfilter. The APs pin these off for the same
# reason (aps/common/files/etc/sysctl.d/99-ap.conf).
#
# Ordering note: br_netfilter is force-loaded via modules-load.d/br_netfilter so
# these keys exist by the time systemd-sysctl runs; otherwise a late auto-load
# of the module would leave the kernel default (call-iptables=1) in force.
net.bridge.bridge-nf-call-iptables = 0
net.bridge.bridge-nf-call-ip6tables = 0
net.bridge.bridge-nf-call-arptables = 0
