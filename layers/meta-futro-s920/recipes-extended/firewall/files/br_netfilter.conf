# Force br_netfilter to load early (systemd-modules-load.service, before
# systemd-sysctl.service) so the bridge-nf-call-* sysctls in
# /etc/sysctl.d/disable-bridge-nf.conf have a target to write. Without this, if
# br_netfilter is a module that something auto-loads *after* systemd-sysctl has
# run, the sysctls silently don't apply and the kernel default
# (bridge-nf-call-iptables=1) wins — re-breaking intra-LAN bridge traffic. If
# br_netfilter is built into the kernel instead, loading it here is a harmless
# no-op. See disable-bridge-nf.conf for the why.
br_netfilter
