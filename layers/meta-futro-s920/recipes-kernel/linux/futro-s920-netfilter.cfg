# nftables / netfilter support.
#
# The stock linux-yocto 6.18 defconfig ships with `# CONFIG_NF_TABLES is not
# set`, which breaks two things this router depends on:
#   1. systemd-networkd's `IPMasquerade=ipv4` (its private `io.systemd.nat`
#      nftables table) — without NF_TABLES it fails at every reconfigure with
#      "Could not enable IP masquerading: Operation not supported", marks the
#      interface Failed, loops forever, and never starts the DHCP server.
#   2. the futro-firewall ruleset (`table inet filter`) — `nft -f` fails with
#      "cache initialization failed: Invalid argument".
# Earlier kernels happened to enable NF_TABLES via the stock defconfig; pin it
# here so the dependency is explicit and survives future kernel bumps.

# nftables core + the families we use: `inet` (firewall) and `ip`/`ip6`
# (networkd NAT, IPv6 rules).
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NF_TABLES_IPV4=y
CONFIG_NF_TABLES_IPV6=y

# Connection tracking — `ct state established,related` / `ct state invalid`
# in both the input and forward chains.
CONFIG_NF_CONNTRACK=y
CONFIG_NFT_CT=y

# NAT + masquerade — IPMasquerade=ipv4 on br-lan and br-iot (NAT44 to WAN).
CONFIG_NF_NAT=y
CONFIG_NFT_NAT=y
CONFIG_NFT_MASQ=y

# `fib` expression — REQUIRED by systemd-networkd's IPMasquerade. Enabling
# IPMasquerade makes networkd build its whole `io.systemd.nat` table in one
# atomic netlink batch, and that batch *always* includes a DNAT prerouting rule
# matching `fib daddr type local` (src/shared/firewall-util.c:
# sd_nfnl_message_new_dnat_rule_pre → nfnl_add_expr_fib). The stock defconfig
# leaves the fib expression out (`# CONFIG_NFT_FIB_IPV4 is not set`), so the
# kernel rejects that rule and the entire atomic batch fails with a bare ENOENT,
# surfaced as "Could not enable IP masquerading: No such file or directory" —
# the table is never created and the interface stays in the failed state (so the
# DHCP server never starts either). The kernel is otherwise fully capable of the
# masquerade structure; the fib expression is the one missing piece.
CONFIG_NFT_FIB_IPV4=y
CONFIG_NFT_FIB_IPV6=y
CONFIG_NFT_FIB_INET=y

# Note: the `counter` expression is built unconditionally into the nf_tables
# core in this kernel — there is no separate CONFIG_NFT_COUNTER to enable.
