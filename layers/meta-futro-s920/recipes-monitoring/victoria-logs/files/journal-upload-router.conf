# Ship the router's own systemd journal to the local VictoriaLogs instance via
# its native journald ingestion endpoint. Overrides the packaged ExecStart
# (reset first, then set) so no /etc/systemd/journal-upload.conf edit is needed.
[Unit]
# Start after VL is up so the uploader doesn't retry against a closed port at
# boot (it's resilient either way, but this keeps the journal quiet).
After=victoria-logs.service
# The upload cursor is persisted on /data (bind mount) so an A/B swap resumes
# instead of re-uploading the retained journal window; start after it mounts.
RequiresMountsFor=/var/lib/systemd/journal-upload

[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-journal-upload --save-state --url=http://127.0.0.1:9428/insert/journald
# Use the static systemd-journal-upload user, not a per-boot dynamic UID: with
# DynamicUser=yes systemd hides StateDirectory under /var/lib/private/... behind
# a symlink, so the cursor wouldn't sit at the real /var/lib/systemd/journal-upload
# path we bind from /data. Pinning the static user keeps the StateDirectory at
# the public path (ownership self-heals by name via futro-data-prep).
DynamicUser=no
