[system]
compatible=futro-s920 home router
bootloader=barebox
bundle-formats=-plain

[keyring]
# Relative path: RAUC resolves it against the directory containing this
# system.conf. meta-rauc's rauc-conf recipe installs both this file and the
# keyring into ${nonarch_libdir}/rauc (/usr/lib/rauc), not /etc/rauc — an
# absolute /etc/rauc/ca.cert.pem path breaks bundle verification after that
# move. Relative keeps it correct wherever the config is loaded from.
path=ca.cert.pem

[slot.rootfs.0]
device=/dev/disk/by-partuuid/f7200003-a001-4000-8001-000000000003
type=ext4
bootname=system0

[slot.rootfs.1]
device=/dev/disk/by-partuuid/f7200004-a001-4000-8001-000000000004
type=ext4
bootname=system1
