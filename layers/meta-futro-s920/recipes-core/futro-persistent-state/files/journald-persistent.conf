[Journal]
Storage=persistent
# VictoriaLogs is the authoritative long-term store (journald is uploaded to it
# via systemd-journal-upload). Keep the on-/data journal as a small bounded
# recent-window buffer for on-device `journalctl`, not unbounded history — VM/VL
# retention governs the long term. Upload is near-real-time, so this window is
# far larger than the upload lag; entries always reach VL before being vacuumed.
SystemMaxUse=200M
MaxRetentionSec=7d
