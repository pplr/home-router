# Global IP forwarding for the router.
#
# Per-interface `IPv4Forwarding=`/`IPv6Forwarding=` in our .network files only
# writes /proc/sys/net/ipv{4,6}/conf/<iface>/forwarding. The IPv6 forward path
# in the kernel (`ip6_forward()` in net/ipv6/ip6_output.c) checks
# `net.ipv6.conf.all.forwarding` *first* and drops the packet immediately if
# it's 0 — per-interface flags are not consulted at all when the global is 0.
# Hence the global must be on for IPv6 LAN→WAN traffic to be forwarded.
#
# IPv4 doesn't strictly need this (per-interface suffices for v4), but we set
# it for symmetry and so the behaviour is obvious from one place.
#
# See CLAUDE.md "Networking Pitfalls".
[Network]
IPv4Forwarding=yes
IPv6Forwarding=yes
