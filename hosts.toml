# Single source of truth for every device on the home network.
#
# Consumed at build time by:
#   - routerbuild/  (this repo) → generates static-lease drop-ins,
#                   /etc/hosts, and the systemd-resolved drop-in baked
#                   into the Futro S920 image.
#   - aps/apbuild/  (this repo) → each [aps.<name>] in aps/config.toml
#                   references a [[hosts]] entry via its `host` field
#                   to learn its own hostname and management IP.
#
# Adding a device:
#   1. Append a [[hosts]] block here.
#   2. Rebuild + RAUC-update the router  → DHCP reservation + DNS take
#      effect.
#   3. (Optional) reference it from aps/config.toml if it's an OpenWrt
#      AP whose UCI config should be generated from this.
#
# `mac` is optional:
#   - WITH mac  → router's DHCP server emits a `[DHCPServerStaticLease]`
#                 so the device always gets the declared IPv4.
#   - WITHOUT   → /etc/hosts + DNS only; the device is expected to
#                 configure its IP statically itself (e.g. an OpenWrt
#                 AP that owns its own `option ipaddr`).
#
# `ap_cert` is optional (default false):
#   - true      → the router obtains a Let's Encrypt cert for
#                 `<first alias>.<ap_cert_domain>` via DNS-01 and pushes
#                 it to the device over SSH. Requires vlan = "lan" and
#                 `[router].ap_cert_domain` + `acme_email` to be set.
#                 Consumed by recipes-extended/futro-ap-certs (router)
#                 and aps/apbuild (bakes the matching key + CSR).

[router]
# Subnets used to validate that every [[hosts]] IP falls inside the
# right VLAN. Keep in sync with the addresses on br-lan and br-iot in
# layers/meta-futro-s920/recipes-core/network/files/30-br-{lan,iot}.network.
lan_subnet = "10.0.0.0/24"
lan_ipv4   = "10.0.0.1"
iot_subnet = "10.0.30.0/24"
iot_ipv4   = "10.0.30.1"

# DHCP search domain pushed to clients (DHCPv4 option 15 via networkd's
# `[DHCPServer] Domains=`). Hosts become `<name>.<dns_search_domain>`
# in /etc/hosts so `ssh ax3600` completes to `ax3600.lan`.
dns_search_domain = "lan"

# Public DNS zone under which per-AP LuCI certificates are issued. Every
# [[hosts]] entry with `ap_cert = true` gets a Let's Encrypt certificate
# for `<first-alias>.<ap_cert_domain>` (e.g. ax59u.ap.verson.lplr.eu),
# obtained by the router via the DNS-01 challenge against the OVH zone.
#
# The A records for these names are LOCAL ONLY — served from the
# generated /etc/hosts via systemd-resolved, so the 10.0.0.0/24 topology
# never appears in public DNS. The only records that ever reach OVH are
# the ephemeral _acme-challenge TXT records lego creates and deletes
# during each validation.
ap_cert_domain = "ap.verson.lplr.eu"

# ACME account contact address (Let's Encrypt expiry notices).
acme_email = "ppaysant@gmail.com"

[router.dhcp.lan]
# Dynamic pool. Static-lease IPs must fall OUTSIDE [offset .. offset+size-1]
# so the DHCP server can't hand them out to a different MAC.
pool_offset = 100
pool_size   = 155
lease_seconds = 3600

[router.dhcp.iot]
pool_offset = 100
pool_size   = 155
lease_seconds = 3600

# ---- hosts ------------------------------------------------------------

# OpenWrt APs. Their IPv4 is configured statically on the AP itself
# (`option ipaddr` in /etc/config/network, generated by aps/apbuild/
# from this same `ipv4` field), so no DHCP reservation is needed —
# `mac` is omitted on purpose.
#
# `ap_cert = true` opts the AP into the centralised ACME flow: the
# router issues a cert for `<first alias>.<ap_cert_domain>` and pushes
# it to the AP, which serves LuCI over HTTPS with it.

[[hosts]]
name    = "ap-ax3600"
ipv4    = "10.0.0.2"
vlan    = "lan"
aliases = ["ax3600"]
ap_cert = true

[[hosts]]
name    = "ap-r3g"
ipv4    = "10.0.0.3"
vlan    = "lan"
aliases = ["r3g"]
ap_cert = true

[[hosts]]
name    = "ap-ax59u"
ipv4    = "10.0.0.4"
vlan    = "lan"
aliases = ["ax59u"]
ap_cert = true

# ---- reserved-lease clients ------------------------------------------
# Devices with a `mac` get a DHCP reservation (always the same IPv4)
# plus /etc/hosts + DNS.

[[hosts]]
name = "nas"
ipv4 = "10.0.0.10"
vlan = "lan"
mac  = "c8:d3:ff:9e:80:c9"
