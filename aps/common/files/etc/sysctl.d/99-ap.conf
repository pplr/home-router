# AP role: pure L2 between the wired uplink and the radio VAPs. The
# router handles all forwarding, NAT, and RA — leave forwarding off so
# a misconfiguration here can't accidentally route around the firewall.
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# Don't accept ICMP redirects from the LAN — the router is the only
# legitimate next-hop, and there are no redundant gateways to advertise.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Bridge netfilter is disabled by default on stock OpenWrt; pin it off
# so traffic between LAN clients and the AP's own SSIDs doesn't
# unexpectedly traverse a (non-existent) iptables stack.
net.bridge.bridge-nf-call-iptables = 0
net.bridge.bridge-nf-call-ip6tables = 0
net.bridge.bridge-nf-call-arptables = 0
