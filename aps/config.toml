# Central fleet config for every OpenWrt AP in the home network.
#
# Edit this to add an AP, change a channel, rotate an SSID name, or pin
# a new OpenWrt release. The build driver (apbuild/) consumes this file
# at build time; nothing on the AP itself ever reads it. UCI files on
# the image (/etc/config/network, /wireless, /system) are generated from
# this config — no separate per-AP templates to keep in sync.

# ---- common ----------------------------------------------------------

[common]
imagebuilder_base = "https://downloads.openwrt.org/releases"
timezone = "CET-1CEST,M3.5.0,M10.5.0/3"
zonename = "Europe/Paris"
country = "FR"

[common.router]
ipv4 = "10.0.0.1"
ipv6 = "2a01:e0a:97f:5432::1"
lan_v6_prefix = "2a01:e0a:97f:5432::/64"

[common.syslog]
ip = "10.0.0.1"
port = 514
proto = "udp"

[common.uplink]
# DSA port name used as the trunk to the home router on every AP. Both
# Xiaomi devices expose this port as `wan`; if a future AP differs, add
# a per-AP `[aps.<name>.uplink]` table with its own `trunk_port_alias`.
trunk_port_alias = "wan"
iot_vlan = 30

[common.packages]
# Image Builder `PACKAGES=` is built from common.packages.add ∪ common.packages.remove
# ∪ aps.<name>.extra_packages, deduped while preserving insertion order.
# A leading `-` removes the package; everything else adds.
add = ["wpad-mbedtls"]
remove = [
    "wpad-basic-mbedtls",
    "dnsmasq",
    "odhcpd",
    "odhcpd-ipv6only",
    "firewall",
    "firewall4",
    "iptables-nft",
    "ip6tables-nft",
    "ppp",
    "ppp-mod-pppoe",
]

# Each [common.ssids.<key>] is one VAP definition broadcast on every
# non-disabled radio of every AP. The <key> after the dot is internal
# (used as part of the generated UCI section name); the visible SSID is
# `name`. PSKs live out-of-tree under aps/secrets/, gitignored.

[common.ssids.trusted]
name = "maison-jaune"
network = "lan"            # AP-side UCI interface → br-lan (untagged)
encryption = "sae"         # WPA3-only; pre-SAE clients can't join
ieee80211w = "2"           # PMF required (mandatory for SAE)
psk_secret = "wifi/psk-trusted"

[common.ssids.iot]
name = "maison-jaune-iot"
network = "iot"            # AP-side UCI interface → br-iot (VLAN 30 trunk)
encryption = "psk2"        # IoT devices are notoriously bad at WPA3
ieee80211w = "0"           # PMF off — old kit chokes on it
psk_secret = "wifi/psk-iot"

# ---- per-AP ----------------------------------------------------------

[aps.ax3600]
# `host` references the [[hosts]] entry in the repo-root hosts.toml that
# owns this AP's hostname + management IP. Single source of truth — the
# router's DNS / /etc/hosts and the AP's own UCI both come from there.
host = "ap-ax3600"
target = "qualcommax/ipq807x"
profile = "xiaomi_ax3600"
version = "25.12.0"
sha256 = "347898b4dec0e8b3fe771a33c912d7191556251c8b20f19a680b6f35120326d8"
extra_packages = ["ath11k-firmware-ipq8074"]

# Radios listed in order — position in this array becomes radio0, radio1,
# radio2 in the generated /etc/config/wireless. `disabled = true` emits
# the wifi-device entry with `option disabled '1'` (so OpenWrt doesn't
# auto-configure it at first boot) but no VAPs are attached to it.

[[aps.ax3600.radios]]
# Legacy PCIe AC card — duplicates 5 GHz spectrum, kept disabled.
path = "soc/20000000.pci/pci0000:00/0000:00:00.0/0000:01:00.0"
disabled = true

[[aps.ax3600.radios]]
path = "platform/soc/c000000.wifi"
band = "5g"
htmode = "HE80"
channel = 36

[[aps.ax3600.radios]]
path = "platform/soc/c000000.wifi+1"
band = "2g"
htmode = "HE40"
channel = 5

[aps.r3g]
host = "ap-r3g"
target = "ramips/mt7621"
profile = "xiaomi_mi-router-3g"
version = "25.12.0"
sha256 = "cc4cc7642ea7c26c8d57695466b86ec7c9c837585aa89649f8da700a6fdb1460"
extra_packages = []

[[aps.r3g.radios]]
path = "1e140000.pcie/pci0000:00/0000:00:00.0/0000:01:00.0"
band = "2g"
htmode = "HT20"
channel = 1

[[aps.r3g.radios]]
path = "1e140000.pcie/pci0000:00/0000:00:01.0/0000:02:00.0"
band = "5g"
htmode = "VHT80"
channel = 161
